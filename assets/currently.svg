<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="250" viewBox="0 0 1200 250"><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;}
:root{--bg1:#f5f5f7;--card:#ffffff;--cardop:.72;--stroke:#ffffff;--t1:#1d1d1f;--t2:#6e6e73;--shadow:#000;--shop:.10;--blob1:#7cc4ff;--blob2:#c9a7ff;--blob3:#ffb3c7;}
@media (prefers-color-scheme: dark){:root{--bg1:#000000;--card:#ffffff;--cardop:.10;--stroke:#ffffff;--t1:#f5f5f7;--t2:#a1a1a6;--shop:.45;--blob1:#0a84ff;--blob2:#5e5ce6;--blob3:#bf5af2;}}
</style><defs>
<linearGradient id="glassfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--card)" stop-opacity="var(--cardop)"/><stop offset="1" stop-color="var(--card)" stop-opacity="calc(var(--cardop) * .6)"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ececf0"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="var(--shop)"/></filter>
<filter id="tshadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".18"/></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
</defs><rect x="50" y="28" width="340" height="190" rx="36" fill="url(#glassfill)" filter="url(#shadow)"/>
<rect x="50.5" y="28.5" width="339" height="189" rx="36" fill="none" stroke="url(#rim)" stroke-width="1"/><text x="220.0" y="108" text-anchor="middle" font-size="52">🧠</text><text x="220.0" y="152" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="-.4" fill="var(--t1)">Second brain</text><text x="220.0" y="184" text-anchor="middle" font-size="17" fill="var(--t2)">My main project right now</text><rect x="430" y="28" width="340" height="190" rx="36" fill="url(#glassfill)" filter="url(#shadow)"/>
<rect x="430.5" y="28.5" width="339" height="189" rx="36" fill="none" stroke="url(#rim)" stroke-width="1"/><text x="600.0" y="108" text-anchor="middle" font-size="52">🌱</text><text x="600.0" y="152" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="-.4" fill="var(--t1)">Learning</text><text x="600.0" y="184" text-anchor="middle" font-size="17" fill="var(--t2)">Something new every day</text><rect x="810" y="28" width="340" height="190" rx="36" fill="url(#glassfill)" filter="url(#shadow)"/>
<rect x="810.5" y="28.5" width="339" height="189" rx="36" fill="none" stroke="url(#rim)" stroke-width="1"/><text x="980.0" y="108" text-anchor="middle" font-size="52">⚡</text><text x="980.0" y="152" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="-.4" fill="var(--t1)">Tinkering</text><text x="980.0" y="184" text-anchor="middle" font-size="17" fill="var(--t2)">Ideas, tools &amp; side projects</text></svg>